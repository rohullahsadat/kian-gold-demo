
<!doctype html>

  <meta property="og:type" content="website">

  <meta name="theme-color" content="#171717">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"

  >

  <!-- Global CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <link rel="stylesheet" href="css/pages/forgot-password.css">

<body data-page="auth">

  <div class="preloader" aria-hidden="true">
    KIAN <span>GOLD</span>
  </div>

  <div data-header></div>

  <main>

    <!-- Password Recovery -->
    <section class="auth-wrap">

      <form id="forgot-form" class="form-card auth-card">

        <span class="eyebrow">بازیابی دسترسی</span>

        <h1>رمز عبور خود را بازیابی کنید</h1>

        <p>
          ایمیل حساب خود را وارد کنید. در نسخه اصلی، لینک بازیابی
          از طریق ایمیل ارسال خواهد شد.
        </p>

        <label>
          نشانی ایمیل
          <input name="email" type="email" required>
        </label>

        <button class="btn btn-gold full" type="submit">
          درخواست بازیابی
        </button>

        <a href="login.html">بازگشت به ورود</a>

        <div class="form-message" aria-live="polite"></div>

        <small>
          ارسال ایمیل در نسخه نمایشی فعال نیست.
        </small>

      </form>

    </section>

  </main>

  <div data-footer></div>

  <!-- Shared Components -->
  <div class="toast-region" aria-live="polite"></div>

  <button class="assistant-launch" aria-label="گفت‌وگو با راهنمای هوشمند">
    ✧
  </button>

  <section class="assistant-panel" aria-label="دستیار نمایشی کیان"></section>

  <button class="back-top" aria-label="بازگشت به بالا">
