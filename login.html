
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ورود | کیان گلد</title>
  <meta
    name="description"
    content="ورود مشتریان — کیان درّالتاج، STAY GOLD"
  >

  <meta property="og:title" content="ورود | کیان گلد">
  <meta property="og:description" content="ورود مشتریان">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#171717">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="assets/images/logo/monogram.svg" type="image/svg+xml">

  <!-- Global CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Login Page CSS -->
  <link rel="stylesheet" href="css/pages/login.css">

  <script type="module" src="js/app.js"></script>
</head>

<body data-page="auth">

  <div class="preloader" aria-hidden="true">
    KIAN <span>GOLD</span>
  </div>

  <div data-header></div>

  <main>

    <!-- Login Form -->
    <section class="auth-wrap">

      <form id="login-form" class="form-card auth-card">

        <span class="eyebrow">خوش آمدید</span>

        <h1>ورود به حساب</h1>

        <label>
          ایمیل یا شماره تماس
          <input
            name="identity"
            required
            autocomplete="username"
          >
        </label>

        <label>
          رمز عبور

          <div class="password-wrap">
            <input
              name="password"
              type="password"
              required
              autocomplete="current-password"
            >

            <button type="button" class="password-toggle">
              نمایش
            </button>
          </div>
        </label>

        <label class="check-line">
          <input type="checkbox" name="remember">
          مرا به خاطر بسپار
        </label>

        <button class="btn btn-gold full" type="submit">
          ورود
        </button>

        <a href="forgot-password.html">
          رمز عبور را فراموش کرده‌اید؟
        </a>

        <p>
          حساب ندارید؟
          <a href="register.html">ثبت‌نام کنید</a>
        </p>

        <div class="form-message" aria-live="polite"></div>

        <small>
          ورود در این نسخه نمایشی است؛ احراز هویت واقعی پس از اتصال Django فعال می‌شود.
        </small>

      </form>

    </section>

  </main>

  <div data-footer></div>

  <!-- Shared Components -->
  <div class="toast-region" aria-live="polite"></div>

  <button class="assistant-launch" aria-label="گفت‌وگو با راهنمای هوشمند">
    ✧
  </button>

  <section class="assistant-panel" aria-label="دستیار نمایشی کیان"></section>

  <button class="back-top" aria-label="بازگشت به بالا">
    ↑
  </button>

</body>
</html>
