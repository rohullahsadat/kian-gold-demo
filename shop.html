
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>فروشگاه | کیان گلد</title>
  <meta
    name="description"
    content="فروشگاه زیورآلات طلا — کیان درّالتاج، STAY GOLD"
  >

  <meta property="og:title" content="فروشگاه | کیان گلد">
  <meta property="og:description" content="فروشگاه زیورآلات طلا">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#171717">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="assets/images/logo/monogram.svg" type="image/svg+xml">

  <!-- Global CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Shop Page CSS -->
  <link rel="stylesheet" href="css/pages/shop.css">

  <script type="module" src="js/app.js"></script>
</head>

<body data-page="shop">

  <div class="preloader" aria-hidden="true">
    KIAN <span>GOLD</span>
  </div>

  <div data-header></div>

  <main>

    <!-- Page Hero -->
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">مجموعه کیان گلد</span>
        <h1>فروشگاه زیورآلات</h1>
        <p>
          قطعه دلخواه خود را از میان مجموعه انگشتر، گردنبند،
          دستبند و گوشواره پیدا کنید.
        </p>
      </div>
    </section>

    <!-- Shop Products -->
    <section class="section">
      <div class="container shop-layout">

        <!-- Filters -->
        <aside class="filters">

          <h3>فیلتر محصولات</h3>

          <label>
            جستجو
            <input
              id="product-search"
              type="search"
              placeholder="نام محصول را بنویسید…"
            >
          </label>

          <label>
            دسته‌بندی
            <select id="category-filter">
              <option value="">همه دسته‌ها</option>
              <option value="rings">انگشتر</option>
              <option value="necklaces">گردنبند</option>
              <option value="bracelets">دستبند</option>
              <option value="earrings">گوشواره</option>
              <option value="wedding">ازدواج</option>
              <option value="exclusive">ویژه</option>
            </select>
          </label>

          <label>
            عیار طلا
            <select id="karat-filter">
              <option value="">همه عیارها</option>
              <option value="18">۱۸ عیار</option>
              <option value="21">۲۱ عیار</option>
              <option value="22">۲۲ عیار</option>
              <option value="24">۲۴ عیار</option>
            </select>
          </label>

          <label>
            حداقل قیمت
            <input
              id="min-price"
              type="number"
              min="0"
              placeholder="از"
            >
          </label>

          <label>
            حداکثر قیمت
            <input
              id="max-price"
              type="number"
              min="0"
              placeholder="تا"
            >
          </label>

          <button class="btn btn-dark" id="clear-filters">
            پاک‌کردن فیلترها
          </button>

        </aside>

        <!-- Shop Results -->
        <div class="shop-results">

          <div class="toolbar">
            <span id="result-count">محصولات</span>

            <select id="sort-products">
              <option value="popular">محبوب‌ترین</option>
              <option value="new">جدیدترین</option>
              <option value="low">ارزان به گران</option>
              <option value="high">گران به ارزان</option>
            </select>
          </div>

          <div class="product-grid" id="shop-products"></div>

          <button class="btn btn-outline load-more" id="load-more">
            نمایش محصولات بیشتر
          </button>

        </div>

      </div>
    </section>

  </main>

  <div data-footer></div>

  <!-- Shared Components -->
  <div class="toast-region" aria-live="polite"></div>

  <button class="assistant-launch" aria-label="گفت‌وگو با راهنمای هوشمند">
    ✧
  </button>

  <section class="assistant-panel" aria-label="دستیار نمایشی کیان"></section>

  <button class="back-top" aria-label="بازگشت به بالا">
    ↑
  </button>

</body>
</html>
