
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>قیمت طلا | کیان گلد</title>
  <meta
    name="description"
    content="نرخ و قیمت طلا — کیان درّالتاج، STAY GOLD"
  >

  <meta property="og:title" content="قیمت طلا | کیان گلد">
  <meta property="og:description" content="نرخ و قیمت طلا">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#171717">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="assets/images/logo/monogram.svg" type="image/svg+xml">

  <!-- Global CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Gold Prices CSS -->
  <link rel="stylesheet" href="css/pages/gold-prices.css">

  <script type="module" src="js/app.js"></script>
</head>

<body data-page="gold">

  <div class="preloader" aria-hidden="true">
    KIAN <span>GOLD</span>
  </div>

  <div data-header></div>

  <main>

    <!-- Page Hero -->
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">شفافیت در ارزش</span>
        <h1>نرخ و قیمت طلا</h1>
        <p>
          نمایش نمونه قیمت بر اساس تنظیمات نمایشی پروژه؛
          این اطلاعات نرخ زنده بازار نیست.
        </p>
      </div>
    </section>

    <!-- Gold Prices -->
    <section class="section">
      <div class="container">

        <div class="notice warning" id="gold-warning">
          داده نمایشی — API بازار زنده متصل نیست.
          برای تصمیم خرید یا فروش به نرخ معتبر روز مراجعه کنید.
        </div>

        <!-- Price Cards -->
        <div class="price-cards" id="gold-price-cards"></div>

        <!-- Price Chart -->
        <div class="chart-card">

          <div class="section-heading">
            <h2>روند نمونه قیمت</h2>
            <span class="muted">
              نمودار نمایشی، نه داده تاریخی واقعی
            </span>
          </div>

          <canvas
            id="gold-chart"
            width="900"
            height="300"
            aria-label="نمودار نمونه قیمت طلا"
          ></canvas>

        </div>

        <!-- Update Information -->
        <p id="gold-updated" class="muted"></p>
        <p id="gold-source" class="muted"></p>

      </div>
    </section>

  </main>

  <div data-footer></div>

  <!-- Shared Components -->
  <div class="toast-region" aria-live="polite"></div>

  <button class="assistant-launch" aria-label="گفت‌وگو با راهنمای هوشمند">
    ✧
  </button>

  <section class="assistant-panel" aria-label="دستیار نمایشی کیان"></section>

  <button class="back-top" aria-label="بازگشت به بالا">
    ↑
  </button>

</body>
</html>
