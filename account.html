
<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>حساب کاربری | کیان گلد</title>

  <!-- SEO & Meta Tags -->
  <meta name="description" content="داشبورد مشتری — کیان درّالتاج، STAY GOLD">
  <meta property="og:title" content="حساب کاربری | کیان گلد">
  <meta property="og:description" content="داشبورد مشتری">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#171717">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Favicon -->
  <link rel="icon" href="assets/images/logo/monogram.svg" type="image/svg+xml">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Page Stylesheet -->
  <link rel="stylesheet" href="css/pages/account.css">

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</head>

<body data-page="account">

  <!-- Preloader -->
  <div class="preloader" aria-hidden="true">
    KIAN <span>GOLD</span>
  </div>

  <!-- Header -->
  <div data-header></div>

  <main>

    <!-- Page Hero -->
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">فضای شخصی شما</span>
        <h1>حساب کاربری</h1>
        <p>مدیریت اطلاعات و پیگیری درخواست‌های سفارش.</p>
      </div>
    </section>

    <!-- Account Dashboard -->
    <section class="section">
      <div class="container account-layout">

        <!-- Account Navigation -->
        <nav class="account-nav">
          <a href="#profile">اطلاعات شخصی</a>
          <a href="#orders">سفارش‌ها</a>
          <a href="wishlist.html">علاقه‌مندی‌ها</a>
          <a href="#addresses">نشانی‌ها</a>

          <button id="demo-logout" class="text-link">
            خروج نمایشی
          </button>
        </nav>

        <!-- Account Content -->
        <div>

          <!-- Personal Information -->
          <section id="profile" class="form-card">
            <h2>اطلاعات شخصی</h2>

            <form id="profile-form">

              <label>
                نام کامل
                <input name="name" placeholder="نام شما">
              </label>

              <label>
                ایمیل
                <input
                  name="email"
                  type="email"
                  placeholder="ایمیل شما"
                >
              </label>

              <label>
                شماره تماس
                <input name="phone" placeholder="شماره تماس">
              </label>

              <button class="btn btn-dark">
                ذخیره نمایشی
              </button>

            </form>

            <div class="form-message"></div>
          </section>

          <!-- Order History -->
          <section id="orders" class="form-card">
            <h2>تاریخچه سفارش‌ها</h2>

            <div id="order-history">
              <p class="muted">
                هنوز سفارشی ثبت نشده است.
              </p>
            </div>
          </section>

          <!-- Saved Addresses -->
          <section id="addresses" class="form-card">
            <h2>نشانی‌های ذخیره‌شده</h2>

            <p class="muted">
              مدیریت نشانی‌ها پس از اتصال حساب کاربری به سرور فعال می‌شود.
            </p>
          </section>

        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <div data-footer></div>

  <!-- Notifications -->
  <div class="toast-region" aria-live="polite"></div>

  <!-- AI Assistant -->
  <button
    class="assistant-launch"
    aria-label="گفت‌وگو با راهنمای هوشمند"
  >✧</button>

  <section
    class="assistant-panel"
    aria-label="دستیار نمایشی کیان"
  ></section>

  <!-- Back to Top -->
  <button
    class="back-top"
    aria-label="بازگشت به بالا"
  >↑</button>

</body>
</html>
